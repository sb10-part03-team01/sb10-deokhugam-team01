spring:
  datasource:
    url: ${RDS_SPRING_DATASOURCE_URL}
    username: ${RDS_SPRING_DATASOURCE_USERNAME}
    password: ${RDS_SPRING_DATASOURCE_PASSWORD}
  sql:
    init:
      mode: never # prod 안전 가드: schema.sql / data.sql / db/seed-qa.sql 어떤 것도 절대 실행하지 않음
  jpa:
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.team01.deokhugam: info
    org.hibernate.SQL: info

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false
