# https://docs.coderabbit.ai/

language: ko-KR # 리뷰 언어를 한국어로 사용
early_access: false # 실험 기능 사용 안함

chat:
  auto_reply: true # PR 코멘트에서 @coderabbitai 를 언급했을 때 자동 응답 활용을 위한 설정
  # PR에서 바로 물어보고 응답받기 가능
  # '이 파일만 다시 봐줘' 같은 작업 지정 가능

reviews:
  changed_files_summary: true # 변경된 파일에 대한 요약 추가
  sequence_diagrams: true # 복잡한 흐름을 시퀀스 다이어그램으로 설명하게 함
  collapse_walkthrough: true # walkthrough 색션을 접은 상태로 둠

  profile: assertive # 리뷰 스타일 지정 chill(기본값), assertive
  request_changes_workflow: false # GitHub의 Request changes 워크플로우를 적극적으로 사용할지 여부
  # false : 팀이 AI를 보조 Reviewer로 사용하고 싶을 때 적합
  high_level_summary: true # 리뷰 상단에 이번 PR이 무엇을 바꾸는지 큰 그림 요약을 붙임
  poem: false # 리뷰에 재미 요소 넣지 않음
  review_status: true # 리뷰 완료 상태나 진행 상태를 PR에 표시
  review_details: false # 리뷰에서 파일/라인 단위의 상세 walkthrough를 줄이는 설정
  auto_review:
    enabled: true # 자동리뷰 켬
    drafts: false # Draft PR은 자동 리뷰하지 않음
    base_branches:
      - "main"
      - "dev"

  path_instructions:
    # 1) 모든 파일에 적용되는 전역 컨텍스트
    - path: "**/*"
      instructions: |
        프로젝트: 덕후감(Deokhugam) — 도서 이미지 OCR 및 ISBN 매칭 서비스, 책 리뷰 커뮤니티 플랫폼

        핵심 도메인 규칙 (위반 시 반드시 지적):

        [사용자]
        - 이메일은 중복 불가 (중복 시 409)
        - 수정 가능한 필드는 닉네임뿐
        - 닉네임 길이: 2~20자
        - 비밀번호 정규식: ^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,20}$
        - 논리 삭제가 기본, 논리 삭제 1일 경과 시 완전 삭제
        - 물리 삭제 시 관련 정보 모두 삭제
        - 로그인 성공 후 모든 요청 헤더에 `Deokhugam-Request-User-ID` 포함
        - 홈, 로그인을 제외한 모든 화면은 로그인 사용자만 접근 가능

        [도서]
        - ISBN은 중복 불가 (중복 시 409)
        - ISBN은 도서 등록 후 수정 불가 (BookUpdateRequest에 isbn 필드가 없어야 함)
        - Naver API로 ISBN 기반 도서 정보 자동 조회
        - 썸네일 이미지는 AWS S3에 저장
        - 논리 삭제가 기본 — 관련 리뷰/댓글이 유지되어야 함
        - 물리 삭제 시 관련 리뷰/댓글도 모두 삭제 (UI 미제공, 테스트로 검증)
        - 목록 조회 검색: 제목/저자/ISBN 부분일치
        - 정렬: title | publishedDate | rating | reviewCount (택1)
        - 커서 페이지네이션 보조 키는 `after` (이전 페이지 마지막 요소의 createdAt)
        - OCR 기반 ISBN 인식은 OCR Space API 활용 (심화)

        [리뷰]
        - 도서별로 사용자당 1개 리뷰만 등록 가능 (중복 시 409)
        - 본인이 작성한 리뷰만 수정/삭제 가능 (타인 시도 시 403)
        - 논리 삭제가 기본 — 좋아요/댓글/활동 점수 유지
        - 인기 도서·파워 유저 점수 산출 시 논리 삭제된 리뷰도 포함해야 함
        - 목록 조회 검색: 작성자 닉네임/내용/도서 제목 부분일치
        - 완전일치 조건: userId, bookId (다중 조건 AND)
        - 정렬: createdAt | rating (택1), 보조 커서는 createdAt(`after`)
        - 응답에 요청자의 좋아요 여부(`likedByMe`) 포함

        [댓글]
        - 본인이 작성한 댓글만 수정/삭제 가능 (타인 시도 시 403)
        - 논리 삭제가 기본 — 활동 점수 유지
        - 인기 리뷰·파워 유저 점수 산출 시 논리 삭제된 댓글도 포함해야 함
        - 목록 조회: 시간 순 정렬 + 커서 페이지네이션, 보조 커서는 createdAt(`after`)

        [대시보드 — 매일 배치로 수행]
        - 인기 도서: 일간/주간/월간/역대, 점수는 해당 기간 리뷰수와 평점 기반
        - 인기 리뷰: 일간/주간/월간/역대, 점수는 해당 기간 좋아요수와 댓글수 기반
        - 파워 유저: 일간/주간/월간/역대, 활동 점수는 작성 리뷰의 인기 점수, 좋아요수, 댓글수 기반

        [알림]
        - 본인 리뷰에 좋아요/댓글이 달리면 생성
        - 본인 리뷰가 기간별 인기 순위 10위 내 진입 시 생성
        - 확인된 알림 중 1주일 경과 시 자동 삭제 (매일 배치)
        - 모든 알림 일괄 읽음 처리 가능
        - 최근 시간 순 + 커서 페이지네이션

        [공통 — 커서 페이지네이션 응답 구조]
        content / nextCursor / nextAfter / size / totalElements / hasNext

        [요청 헤더 규약]
        - 인증된 요청은 `Deokhugam-Request-User-ID` 헤더로 사용자 ID 전달
        - 누락 시 400, 본인 리소스 검증 실패 시 403

    # 2) REST 컨트롤러
    - path: "**/controller/**/*.java"
      instructions: |
        - 모든 입력 DTO는 `@Valid` + Bean Validation으로 검증
        - 인증 필요 엔드포인트는 `@RequestHeader("Deokhugam-Request-User-ID")` 적용
          (회원가입, 로그인, 도서 목록, 댓글 목록, 대시보드 조회 등 헤더가 필요 없는 곳은 제외 — API 명세 기준)
        - 커서 페이지네이션 엔드포인트는 `cursor`, `after`, `limit`, `direction`, `orderBy` 시그니처가 명세서와 일치
        - 응답은 항상 DTO로 변환 — 엔티티 직접 노출 금지
        - HTTP 상태 코드가 API 명세와 일치하는지 확인
          (생성 201, 삭제 204, 입력 검증 실패 400, 권한 없음 403, 리소스 없음 404, 중복 409, 서버 오류 500)
        - 비즈니스 로직은 컨트롤러에 두지 말고 서비스로 위임
        - 도서 등록/수정은 multipart/form-data (`bookData` + `thumbnailImage`) 형식 처리

    # 3) 서비스
    - path: "**/service/**/*.java"
      instructions: |
        - 변경 메서드는 `@Transactional`, 조회 전용은 `readOnly = true`
        - 도메인 규칙 위반 시 의미 있는 커스텀 예외 throw
          (이메일 중복, ISBN 중복, 리뷰 중복 → 409 매핑)
        - 논리 삭제 기본: 삭제 플래그만 변경, 일반 조회에서는 삭제된 데이터 제외
        - 단, 인기 도서/인기 리뷰/파워 유저 점수 산출은 논리 삭제 데이터도 포함
        - 본인 리소스 권한 검증: 헤더 사용자 ID와 리소스 소유자 ID 비교, 불일치 시 403
        - Naver Book API / OCR Space API / S3 호출 시 타임아웃·재시도·예외 매핑 적절성 확인
        - 트랜잭션 범위 내 장시간 외부 I/O 호출 회피, N+1 쿼리 점검

    # 4) Repository
    - path: "**/repository/**/*.java"
      instructions: |
        - 커서 페이지네이션 쿼리는 (정렬 키, createdAt) 복합 비교로 안정 페이징 보장
        - 일반 조회 쿼리에는 논리 삭제 필터 일관 적용
        - 인기 도서/리뷰/파워 유저 점수 산출 쿼리는 논리 삭제 데이터 포함 (명세 요구사항)
        - 도서 목록 검색은 제목/저자/ISBN 부분일치(LIKE) — 인덱스/성능 영향 검토
        - 리뷰 목록 검색은 닉네임/내용/도서 제목 부분일치 — 조인 성능 검토

    # 5) 엔티티
    - path: "**/{entity,domain,model}/**/*.java"
      instructions: |
        - 도서 엔티티의 ISBN 필드는 setter 부재 또는 불변성 보장 (수정 불가 규칙)
        - 논리 삭제 필드(예: deletedAt) 적용 또는 베이스 엔티티 상속
        - createdAt/updatedAt 자동 관리 (`@CreatedDate`, `@LastModifiedDate`)
        - 도서: 제목/저자/소개/출판사/출간일/ISBN(optional)/썸네일URL(optional)/리뷰수/평점
        - 리뷰: 도서/사용자/평점(1~5)/내용/좋아요수/댓글수
        - 댓글: 리뷰/사용자/내용
        - 알림: 리뷰/사용자/내용/확인 여부
        - 연관관계 기본 LAZY

    # 6) DTO
    - path: "**/dto/**/*.java"
      instructions: |
        - Request DTO는 Bean Validation으로 명세 제약 표현
          - 닉네임: @Size(min=2, max=20)
          - 비밀번호: @Pattern(정규식)
          - 평점: @Min(1) @Max(5)
          - 필수 필드: @NotNull / @NotBlank
        - Response DTO에 비밀번호 등 민감 필드 포함 금지
        - 커서 응답은 content/nextCursor/nextAfter/size/totalElements/hasNext 구조 유지
        - ReviewDto에 likedByMe 포함 (헤더 요청자 기준)
        - BookUpdateRequest에는 isbn 필드가 없어야 함 (ISBN 수정 불가 규칙)

    # 7) 예외 처리
    - path: "**/exception/**/*.java"
      instructions: |
        - 도메인 의미를 담은 커스텀 예외 사용 (RuntimeException 직접 throw 지양)
        - `@RestControllerAdvice` 글로벌 핸들러에서 명세 상태 코드와 일관 매핑
          (400/401/403/404/409/500)
        - 응답 바디에 스택 트레이스/내부 구현 노출 금지
        - 사용자용 메시지와 로그용 메시지 분리

    # 8) 로깅 / MDC
    - path: "**/{filter,interceptor,logging,log}/**/*.java"
      instructions: |
        - 요청 ID와 클라이언트 IP를 MDC에 추가
        - MDC 값을 로그 메시지와 응답 헤더에 포함
        - 요청 종료 시 MDC 정리 (MDC.clear)
        - 비밀번호/토큰/개인정보는 절대 로그로 남기지 않을 것
        - 날짜별 로그를 S3에 주기적으로 적재 (심화 요구사항)

    # 9) 배치 / 스케줄러
    - path: "**/{batch,scheduler,job}/**/*.java"
      instructions: |
        - 인기 도서/인기 리뷰/파워 유저 점수 산출은 매일 배치로 수행
        - 1주일 경과 알림 삭제도 매일 배치
        - 점수 산출 시 논리 삭제된 데이터도 포함
        - 멱등성: 동일 일자 재실행에도 중복 데이터가 쌓이지 않아야 함
        - 청크/페이징 처리로 대용량 OOM 방지
        - Spring Batch 사용 시 (심화 요구사항):
          - JobParameters에 실행 일자 포함
          - skip/retry 정책 명시
          - 커스텀 메트릭을 Spring Actuator로 노출

    # 10) 외부 API 클라이언트
    - path: "**/{client,external,naver,ocr,s3}/**/*.java"
      instructions: |
        - Naver Book API: ISBN 기반 도서 정보 조회용
        - OCR Space API: 도서 이미지에서 ISBN 인식용 (심화)
        - AWS S3: 도서 썸네일 저장용 + 날짜별 로그 적재용 (심화)
        - 자격 증명/API 키 하드코딩 금지 → 외부 설정 주입
        - 타임아웃/재시도/에러 매핑 정책 명확화
        - 외부 API 실패가 트랜잭션을 오염시키지 않도록 격리

    # 11) 설정 클래스
    - path: "**/config/**/*.java"
      instructions: |
        - 자격 증명/시크릿 하드코딩 금지 → `@Value`/`@ConfigurationProperties` 외부화
        - Naver/OCR/S3 클라이언트 빈은 타임아웃/커넥션 풀 설정 확인
        - CORS는 프론트엔드와 연동되는 도메인만 허용 (와일드카드 남발 금지)

    # 12) 테스트 (TDD)
    - path: "**/src/test/**/*.java"
      instructions: |
        - TDD 원칙: Red-Green-Refactor 사이클, 단계별 커밋 권장 (선택)
        - 핵심 도메인 규칙 테스트 누락 여부:
          - 이메일 중복 차단
          - ISBN 중복 차단, ISBN 수정 불가
          - 도서별 1리뷰 제약
          - 본인 리소스만 수정/삭제 가능 (403 시나리오)
          - 논리 삭제 후 일반 조회에서 제외
          - 논리 삭제 후에도 점수 산출에는 포함
          - 물리 삭제 시 관련 데이터 모두 삭제 (UI 미제공이므로 테스트로 반드시 검증)
          - 커서 페이지네이션 정합성 (cursor + after 조합)
          - 좋아요/댓글/인기 순위 진입에 따른 알림 생성
          - 1주일 경과 알림 자동 삭제
        - 테스트 메서드명은 시나리오를 명확히 (given-when-then 권장)
        - 외부 API(Naver/OCR/S3)는 모킹 또는 테스트더블 사용
        - 전체 커버리지 80% 이상 — 신규 코드 테스트 누락 시 지적

    # 13) GitHub Actions
    - path: ".github/workflows/**/*.{yml,yaml}"
      instructions: |
        - 시크릿은 `${{ secrets.* }}`로만 참조, 평문 금지
        - PR 생성 시 테스트가 수행되어야 하고, 커버리지 80% 이상 게이트 적용
        - AWS ECS 자동 배포 흐름 분리 명확성
        - 액션 버전은 SHA 또는 메이저 태그 고정 (`@latest`/임의 브랜치 참조 금지)

    # 14) 빌드 스크립트
    - path: "**/*.{gradle,gradle.kts}"
      instructions: |
        - 테스트 커버리지 도구 설정 + 80% 임계값 게이트
        - 커버리지 배지를 README에서 사용할 수 있도록 리포트 출력 경로 일관성
        - 불필요한 플러그인/의존성 추가 점검

    # 15) README
    - path: "README.md"
      instructions: |
        - 프로젝트 개요, 팀원 구성, 기술 스택, 팀원별 구현 기능 명시
        - 테스트 커버리지 배지가 메인 브랜치 기준으로 표시되어야 함
        - 백엔드 배포 링크와 API 명세 링크 포함 권장
